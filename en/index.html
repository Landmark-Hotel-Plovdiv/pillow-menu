<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Pillow Menu | Landmark Creek Hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{color-scheme:dark;--navy:#0b2c53;--deep:#071d38;--paper:#f8f4ea;--ink:#13253d;--gold:#b8964a;--goldl:#d8c58b;--leaf:#3e6a52;--desk:#0a1d2b;--desk2:#143246;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){color-scheme:light;--desk:#cfc8b6;--desk2:#e6e0d0}}
:root[data-theme=light]{color-scheme:light;--desk:#cfc8b6;--desk2:#e6e0d0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,var(--desk2),var(--desk) 75%);font-family:Jost,system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;outline:none}
#book{position:relative;height:660px;perspective:2600px;transition:transform .9s cubic-bezier(.45,.05,.25,1);flex:none}
#book::after{content:"";position:absolute;left:4%;right:4%;bottom:-14px;height:26px;background:radial-gradient(ellipse at 50% 0,rgba(0,0,0,.55),transparent 70%);filter:blur(6px);z-index:-1}
.sheet{position:absolute;top:0;width:480px;height:660px;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.05s cubic-bezier(.45,.05,.25,1)}
.sheet.fl{transform:rotateY(-180deg)}
.single .sheet.fl{opacity:0;pointer-events:none;transition:transform 1.05s cubic-bezier(.45,.05,.25,1),opacity .25s .8s}
.pg{--tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .35 0 0 0 0 .25 0 0 0 .08 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");--bg:var(--paper);position:absolute;inset:0;box-sizing:border-box;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:56px 46px 56px;font:300 14.5px/1.56 Jost,sans-serif;color:var(--ink);background:linear-gradient(var(--gd),rgba(0,0,0,.2),rgba(0,0,0,.04) 6%,transparent 12%),var(--tex),var(--bg)}
.f{--gd:to right}.b{--gd:to left;transform:rotateY(180deg)}
.pg::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(to right,rgba(5,15,35,.45),transparent 75%)}
.b::after{background:linear-gradient(to left,rgba(5,15,35,.45),transparent 75%)}
.mv .pg::after{animation:sh 1.05s}
@keyframes sh{50%{opacity:1}}
.nv{--bg:var(--navy);color:#e9e2cf}
.deep{--bg:var(--deep)}
.hd{position:absolute;top:24px;left:46px;right:46px;display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.14em;color:var(--gold)}
.hd b{font-weight:500}.hd i{margin-left:auto;font-style:normal;opacity:.8}
.nv .hd{color:var(--goldl)}
.fo{position:absolute;bottom:24px;right:46px;font:italic 500 15px 'Cormorant Garamond',serif;color:var(--gold)}
.o .fo{right:auto;left:46px}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;margin:0;line-height:1.02}
h1{font-size:54px;letter-spacing:-.01em}
h2{font-size:29px;font-style:italic;line-height:1.14;color:var(--navy)}
h3{font-size:19px;font-weight:600;color:var(--navy);margin:16px 0 4px}
p{margin:0 0 10px}
.sm{font-size:12.2px;line-height:1.5;font-style:italic;color:#4d5a6e}
.nv .sm{color:#b9c3d3}
.gold{color:var(--gold)}
.wv{position:absolute;left:0;bottom:0;width:100%;height:60px}.wv path{fill:none;stroke:var(--goldl);stroke-width:1;opacity:.5}
.cv{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px}
.fr{position:absolute;inset:20px;border:1px solid rgba(216,197,139,.7)}.fr+.fr{inset:26px;border-color:rgba(216,197,139,.3)}
.cv h1{font-size:74px;font-style:italic;color:#f6efd9;margin:26px 0 20px}
.cv .k{font:italic 400 21px 'Cormorant Garamond',serif;color:var(--goldl)}
.cv .w{position:absolute;bottom:62px;left:0;right:0;font-size:11.5px;letter-spacing:.16em;color:var(--goldl)}
.rule{width:54px;height:1px;background:var(--gold);margin:16px 0}
.mn{display:flex;align-items:baseline;gap:10px;padding:11px 0}
.mn .n{font:italic 500 21px 'Cormorant Garamond',serif;color:var(--gold);width:30px}
.mn .t{font:600 22px 'Cormorant Garamond',serif;color:var(--navy)}
.mn .t small{display:block;font:italic 400 12.5px Jost,sans-serif;color:#5b687b}
.mn .d{flex:1;border-bottom:1.5px dotted rgba(11,44,83,.35);align-self:flex-end;margin-bottom:7px}
.mn .z{font-size:13px;color:var(--navy);white-space:nowrap}
.vis{display:flex;flex-direction:column}
.vis .nu{font:italic 500 130px/0.9 'Cormorant Garamond',serif;color:rgba(216,197,139,.9);margin-top:16px}
.vis svg.pl{width:100%;margin:14px 0 8px}
.vis h1{font-size:60px;font-style:italic;color:#f6efd9}
.vis .tg{font:italic 400 18px 'Cormorant Garamond',serif;color:var(--goldl);margin-top:8px}
.sz{display:flex;gap:10px;align-items:baseline;margin:10px 0 12px;padding:6px 0;border-top:1px solid rgba(184,150,74,.5);border-bottom:1px solid rgba(184,150,74,.5);font-size:13px}
.sz b{font-weight:500;color:var(--gold);letter-spacing:.08em}
ul{list-style:none;margin:6px 0 10px;padding:0}
li{position:relative;padding:3px 0 3px 22px}
li::before{content:"";position:absolute;left:2px;top:9px;width:10px;height:10px;border-radius:0 100% 0 100%;background:var(--leaf)}
.note:empty{display:none}.note{position:absolute;left:46px;right:46px;bottom:52px;padding-top:9px;border-top:1px solid rgba(11,44,83,.2)}
.st{display:flex;gap:16px;margin:18px 0}
.st .r{font:italic 500 40px/1 'Cormorant Garamond',serif;color:var(--gold);width:46px;flex:none}
.st h3{margin:2px 0 3px;font-size:22px}
.ct{margin-top:22px}.ct b{display:block;font:500 11px Jost;letter-spacing:.12em;color:var(--gold);margin-top:11px}
.ct span{font-size:15px}
.g{flex:none}.sp{display:block;margin:20px 0 4px}
@media(prefers-reduced-motion:reduce){.sheet,#book,.single .sheet.fl{transition-duration:.01s!important}.mv .pg::after{animation:none}}
.lg{width:330px;height:105px;margin-bottom:30px;background:var(--hl-g) center/contain no-repeat}.pc{display:inline-block;background:#f8f4ea;padding:7px 16px;border-radius:5px;margin-top:12px}.pc img{width:120px;display:block}
.hd{top:16px}
.tg{display:flex;align-items:center;gap:12px;margin-top:14px}
.flag{width:33px;height:22px;object-fit:cover;display:block;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.mn .t small{margin-top:2px;height:24px;display:flex;align-items:center}
.mn{padding:13px 0}.mn .t.ln{font-size:16px;line-height:1.12}
.vis h1.ln{font-size:36px;line-height:1.05}

let cur=0,single=null,sheets=[],n=0,busy=false;
const face=(i,s)=>`<div class="pg ${s} ${i%2?'o':''} ${faces[i][0]}">${faces[i][1]}${i>0&&i<faces.length-1?`<span class="fo">${i}</span>`:''}</div>`;
function build(){single=innerWidth<760;book.className=single?'single':'';book.innerHTML='';sheets=[];
n=single?faces.length:faces.length/2;book.style.width=(single?P:2*P)+'px';
for(let i=0;i<n;i++){const s=document.createElement('div');s.className='sheet';s.style.left=(single?0:P)+'px';
s.innerHTML=single?face(i,'f')+'<div class="pg b" style="--bg:#e9e3d2"></div>':face(2*i,'f')+face(2*i+1,'b');book.appendChild(s);sheets.push(s)}
cur=Math.min(cur,single?n-1:n);fit();render();}
function fit(){const k=Math.min((innerWidth-20)/(single?P:2*P),(innerHeight-60)/H,1.4);book.dataset.k=k;shift()}
function shift(){const k=+book.dataset.k;const t=single?0:cur==0?-P/2:cur==n?P/2:0;book.style.transform=`scale(${k}) translateX(${t}px)`}
function render(){sheets.forEach((s,i)=>{s.classList.toggle('fl',i<cur);if(!s.classList.contains('mv'))s.style.zIndex=i<cur?i+1:n-i});shift()}
function go(d){const nx=cur+d;if(nx<0||nx>(single?n-1:n)||busy)return;busy=true;const s=sheets[d>0?cur:cur-1];s.classList.add('mv');s.style.zIndex=200;cur=nx;render();
setTimeout(()=>{s.classList.remove('mv');s.style.zIndex=s.classList.contains('fl')?sheets.indexOf(s)+1:n-sheets.indexOf(s);busy=false},1060)}
let x0=0;stage.addEventListener('pointerdown',e=>x0=e.clientX);
stage.addEventListener('pointerup',e=>{const dx=e.clientX-x0;if(Math.abs(dx)>45)return go(dx<0?1:-1);
const max=single?n-1:n;go(cur==0?1:cur==max?-1:(e.clientX>innerWidth*(single?.35:.5)?1:-1))});
addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key==' ')go(1);if(e.key=='ArrowLeft')go(-1)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{(innerWidth<760)!==single?build():fit()},120)});
build();setTimeout(()=>{const s=sheets[0];if(cur||!s)return;s.style.transform='rotateY(-9deg)';setTimeout(()=>s.style.transform='',650)},900);
